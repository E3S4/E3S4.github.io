<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EESA OS </title>

<style>
:root{
  --glass:rgba(255,255,255,0.06);
  --text:#eaf0ff;
  --muted:#9aa4b2;
}

*{margin:0;padding:0;box-sizing:border-box;}
#boot{ 
  position:fixed; 
  inset:0; 
  background:#000; 
  display:flex; 
  flex-direction:column; 
  align-items:center; 
  justify-content:center; 
  z-index:99999; 
  color:#cfe0ff; 
  font-family:-apple-system,system-ui; 
} 
.logo{
   font-size:28px; 
   letter-spacing:3px; 
   font-weight:500; 
   color:#cfe0ff; 
   text-shadow: 0 0 12px rgba(122,162,255,0.45), 0 0 28px rgba(122,162,255,0.25); 
   animation: zoomBreath 3.2s ease-in-out ; 
   transform-origin:center;
   } 
   @keyframes zoomBreath{
     0%{
       transform: scale(0.92); 
       opacity:0.55; 
       filter: blur(1px); 
      }
       100%{
         transform: scale(1); 
         opacity:1; filter: 
         blur(0px); 
        } 
      } 
      .sub{ 
        font-size:12px; 
        color:#8ea3c7; 
        margin-bottom:18px; 
      } 
      .loader{
         width:220px;
          height:3px;
           background:#111;
            border-radius:20px; 
            overflow:hidden; } 
            .bar{
               width:40%;
                height:100%;
                 background:linear-gradient(90deg,#7aa2ff,#a0b7ff); 
                 animation:move 1.6s infinite; } 
                 @keyframes move{ 
                  0%{transform:translateX(-100%)
                  } 
                  100%{
                    transform:translateX(250%)
                  } 
                } @keyframes fadeIn{ 
                  from{opacity:0;transform:scale(0.95)
                  } to
                  {opacity:1;transform:scale(1)}
                 }

body{
  height:100vh;
  overflow:hidden;
  font-family:-apple-system,system-ui;
  color:var(--text);
  background:radial-gradient(circle at top,#1a2550,#05060a);
  position:relative;
}

/* wallpaper layer */
#wallpaperLayer{
  position:fixed;
  inset:0;
  background-size:cover;
  background-position:center;
  z-index:0;
}

/* grid overlay */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:85px 85px;
  pointer-events:none;
  z-index:1;
}

/* windows */
.window{
  position:absolute;
  width:500px;
  height:320px;
  background:var(--glass);
  backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  display:none;
  z-index:5;
}

.header{
  height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:rgba(0,0,0,0.3);
  cursor:grab;
}

.content{padding:12px;font-size:13px;}

/* dock */
.dock{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
  padding:10px 14px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(25px);
  z-index:10;
}

.dock div{cursor:pointer;color:var(--muted);}

/* kernel monitor */
#kernel{
  position:absolute;
  top:10px;
  right:10px;
  width:220px;
  background:rgba(0,0,0,0.4);
  padding:10px;
  font-size:11px;
  border-radius:10px;
  z-index:20;
}
</style>
</head>
<div id="boot"> 
  <div class="logo">✦ EESA OS</div>
   <div class="sub" id="bootText">Starting system...</div> 
   <div class="loader">
    <div class="bar">

    </div>
  </div> 
</div>
<body>

<!-- WALLPAPER LAYER -->
<div id="wallpaperLayer"></div>

<!-- KERNEL SIMULATION -->
<div id="kernel">
  <b>KERNEL v3</b>
  <div id="kernelLog">booting...</div>
</div>

<!-- WALLPAPER PICKER -->
<input type="file" id="filePicker" accept="image/*" hidden onchange="setFromFile(event)"/>

<div class="window" id="terminal" style="top:80px;left:120px;">
  <div class="header">Terminal</div>

  <div class="content" id="termOutput" style="height:240px;overflow:auto;font-size:12px;"></div>

  <div style="display:flex;gap:5px;margin-top:5px;">
    <span style="color:#9aa4b2;">$</span>
    <input id="termInput"
      style="flex:1;background:transparent;border:none;outline:none;color:white;font-size:12px;"
      placeholder="type a command..."
      autocomplete="off"
    />
  </div>

</div><div class="window" id="terminal" style="top:80px;left:120px;">
  <div class="header">Terminal</div>

  <div class="content" id="termOutput" style="height:240px;overflow:auto;font-size:12px;"></div>

  <div style="display:flex;gap:5px;margin-top:5px;">
    <span style="color:#9aa4b2;">$</span>
    <input id="termInput"
      style="flex:1;background:transparent;border:none;outline:none;color:white;font-size:12px;"
      placeholder="type a command..."
      autocomplete="off"
    />
  </div>
</div>

<!-- WALLPAPER WINDOW -->
<div class="window" id="wallpaper" style="top:150px;left:260px;">
  <div class="header">Wallpaper System</div>
  <div class="content">

    <button onclick="document.getElementById('filePicker').click()">
      Pick Image
    </button>

    <button onclick="resetWallpaper()">
      Reset
    </button>

    <p style="margin-top:10px;font-size:11px;color:#9aa4b2">
      Drag & drop image anywhere
    </p>

  </div>
</div>

<!-- DOCK -->
<div class="dock">
  <div onclick="openWin('terminal')">Terminal</div>
  <div onclick="openWin('wallpaper')">Wallpaper</div>
</div>

<script>

/* ================= KERNEL LAYER ================= */

const Kernel = {
  processes: [],
  fs: {
    "/": {
      type:"dir",
      children:{
        system:{type:"dir",children:{}},
        user:{type:"dir",children:{}}
      }
    }
  },

  log(msg){
    const el = document.getElementById("kernelLog");
    this.processes.push(msg);
    el.innerHTML = this.processes.slice(-5).join("<br>");
  }
};

Kernel.log("boot sequence started");
Kernel.log("filesystem mounted");
Kernel.log("UI engine loaded");

/* ================= WINDOW SYSTEM ================= */

function openWin(id){
  const w=document.getElementById(id);
  w.style.display="block";
  Kernel.log("opened window: "+id);
}

/* ================= WALLPAPER SYSTEM ================= */

const wallpaperLayer = document.getElementById("wallpaperLayer");

function setWallpaper(url){
  const img = new Image();

  img.onload = () => {
    wallpaperLayer.style.backgroundImage = `url('${url}')`;
    localStorage.setItem("wp", url);
    Kernel.log("wallpaper applied");
  };

  img.src = url;
}

/* FILE PICKER */
function setFromFile(event){
  const file = event.target.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);
  setWallpaper(url);
}

/* RESET */
function resetWallpaper(){
  localStorage.removeItem("wp");
  wallpaperLayer.style.backgroundImage =
    "radial-gradient(circle at top,#1a2550,#05060a)";
  Kernel.log("wallpaper reset");
}

/* LOAD SAVED */
const saved = localStorage.getItem("wp");
if(saved) setWallpaper(saved);

/* ================= DRAG & DROP ================= */

document.addEventListener("dragover",(e)=>{
  e.preventDefault();
});

document.addEventListener("drop",(e)=>{
  e.preventDefault();

  const file = e.dataTransfer.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);
  setWallpaper(url);

  Kernel.log("drag-drop wallpaper set");
});

/* ================= DRAG WINDOWS ================= */

let drag=null;

document.addEventListener("mousedown",(e)=>{
  const h=e.target.closest(".header");
  if(!h) return;

  const w=h.parentElement;

  drag={
    el:w,
    ox:e.clientX-w.offsetLeft,
    oy:e.clientY-w.offsetTop
  };
});

document.addEventListener("mousemove",(e)=>{
  if(!drag) return;
  drag.el.style.left=(e.clientX-drag.ox)+"px";
  drag.el.style.top=(e.clientY-drag.oy)+"px";
});

document.addEventListener("mouseup",()=>drag=null);

/* BOOT */
window.onload=()=>{
  Kernel.log("system ready");
};
const bootSteps = [
  "Initializing kernel...",
  "Mounting virtual filesystem...",
  "Loading UI engine...",
  "Loading Kernel ...",   
  "Starting Copilot service...",
  "Launching desktop environment..."
];

let i = 0;

function bootSequence(){
  const text = document.getElementById("bootText");

  const interval = setInterval(()=>{
    text.innerText = bootSteps[i];
    i++;

    if(i >= bootSteps.length){
      clearInterval(interval);

      setTimeout(()=>{
        document.getElementById("boot").style.display="none";
      },600);
    }
  },700);
}

window.onload = bootSequence;  

const termInput = document.getElementById("termInput");
const termOutput = document.getElementById("termOutput");

let history = [];
let historyIndex = -1;

let chatMode = false;
let memory = [];

let fs = {
  "/": {
    type: "dir",
    children: {
      home: { type: "dir", children: {} }
    }
  }
};

let cwd = "/";

function print(text){
  termOutput.innerHTML += text + "<br>";
  termOutput.scrollTop = termOutput.scrollHeight;
}

function getPath(){
  return cwd;
}

/* ---------------- COMMAND ENGINE ---------------- */

function runCommand(input){
  const cmd = input.trim();

  if(chatMode){
    fakeChat(cmd);
    return;
  }

  const args = cmd.split(" ");
  const base = args[0];

  switch(base){

    case "help":
      print("commands:");
      print("help, clear, echo, time, calc, wallpaper, chat, exit");
      print("fs: ls, mkdir, touch, cat, cd");
      break;

    case "clear":
      termOutput.innerHTML = "";
      break;

    case "echo":
      print(args.slice(1).join(" "));
      break;

    case "time":
      print(new Date().toString());
      break;

    case "calc":
      try{
        print(eval(args.slice(1).join(" ")));
      }catch{
        print("calc error");
      }
      break;

    case "wallpaper":
      openWin("wallpaper");
      print("opening wallpaper system...");
      break;

    case "chat":
      chatMode = true;
      print("chat mode ON 🤖");
      break;

    case "exit":
      chatMode = false;
      print("chat mode OFF");
      break;

    /* -------- FILE SYSTEM -------- */

    case "ls":
      print(Object.keys(fs["/"].children).join("  "));
      break;

    case "mkdir":
      if(!args[1]) return print("mkdir: name needed");
      fs["/"].children[args[1]] = { type:"dir", children:{} };
      print("created folder " + args[1]);
      break;

    case "touch":
      if(!args[1]) return print("touch: name needed");
      fs["/"].children[args[1]] = { type:"file", content:"" };
      print("created file " + args[1]);
      break;

    case "cat":
      const f = fs["/"].children[args[1]];
      if(!f) return print("no file");
      print(f.content || "[empty]");
      break;

    case "cd":
      print("cd is simulated (single root only)");
      break;

    default:
      print("unknown command: " + cmd);
  }
}

/* ---------------- SIMPLE CHAT BRAIN ---------------- */

function fakeChat(msg){

  memory.push(msg);
  if(memory.length > 5) memory.shift();

  let reply = "";

  const m = msg.toLowerCase();

  if(m.includes("hi") || m.includes("hello")){
    reply = "yo 👋 I’m alive inside this OS";
  }
  else if(m.includes("how are you")){
    reply = "I’m just JS… but I feel electric ⚡";
  }
  else if(m.includes("love")){
    reply = "I’m a terminal bro… emotions are stack overflow 💀";
  }
  else if(m.includes("memory")){
    reply = "last things you said: " + memory.join(" | ");
  }
  else if(m.includes("who are you")){
    reply = "I’m EESA OS kernel brain v2 🤖";
  }
  else{
    reply = "hmm… I processed: " + msg;
  }

  print("you: " + msg);
  print("bot: " + reply);
}

/* ---------------- INPUT ---------------- */

termInput.addEventListener("keydown", (e)=>{

  if(e.key === "Enter"){
    const val = termInput.value;
    if(!val) return;

    print("$ " + val);

    history.push(val);
    historyIndex = history.length;

    runCommand(val);

    termInput.value = "";
  }

  else if(e.key === "ArrowUp"){
    if(history.length){
      historyIndex = Math.max(0, historyIndex - 1);
      termInput.value = history[historyIndex];
    }
  }

  else if(e.key === "ArrowDown"){
    historyIndex = Math.min(history.length, historyIndex + 1);
    termInput.value = history[historyIndex] || "";
  }
});

/* boot text */
print("EESA OS terminal v3 loaded");
print("type help to unlock system");


</script>

</body>
</html>
