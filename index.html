<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EESA VisionOS // Polished</title>

<style>
:root{
  --bg:#070a12;
  --glass:rgba(255,255,255,0.06);
  --text:#eaf0ff;
  --muted:#a3adc2;
  --accent:#7aa2ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* ✨ REAL MAC-STYLE TYPOGRAPHY STACK */
body{
  height:100vh;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  background:radial-gradient(circle at top,#1a2550,#05060a);
  color:var(--text);
}

/* subtle depth grid */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:80px 80px;
  pointer-events:none;
}

/* ================= DOCK ================= */
.dock{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:14px;
  padding:10px 16px;
  border-radius:18px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);
}

.dock div{
  font-size:12px;
  color:var(--muted);
  cursor:pointer;
  transition:0.25s;
}

.dock div:hover{
  color:white;
  transform:scale(1.08);
}

/* ================= WINDOW ================= */
.window{
  position:absolute;
  width:520px;
  height:340px;
  background:var(--glass);
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  overflow:hidden;
  display:none;
  box-shadow:0 60px 160px rgba(0,0,0,0.7);
  transition:0.25s ease;
}

.header{
  height:38px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  background:rgba(0,0,0,0.25);
  cursor:grab;
  user-select:none;
}

.title{
  font-size:12px;
  color:var(--muted);
}

.controls{
  display:flex;
  gap:6px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.red{background:#ff5f57;}
.yellow{background:#febc2e;}
.green{background:#28c840;}

/* ================= CONTENT ================= */
.content{
  padding:14px;
  font-size:13px;
  line-height:1.6;
}

/* ================= TERMINAL ================= */
.terminal{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  height:260px;
  overflow:auto;
  white-space:pre-wrap;
  font-size:13px;
}

input{
  width:100%;
  padding:10px;
  border:none;
  outline:none;
  background:rgba(0,0,0,0.4);
  color:white;
  border-top:1px solid rgba(255,255,255,0.08);
  font-family:ui-monospace;
  font-size:13px;
}

/* ================= COPILOT PANEL ================= */
.copilot{
  position:absolute;
  right:20px;
  top:20px;
  width:280px;
  height:180px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);
  padding:12px;
  display:none;
}

.copilot input{
  margin-top:8px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<!-- DOCK -->
<div class="dock">
  <div onclick="openWin('terminal')">Terminal</div>
  <div onclick="openWin('apps')">Projects</div>
  <div onclick="openWin('profile')">Profile</div>
  <div onclick="toggleCopilot()">Copilot</div>
</div>

<!-- COPILOT -->
<div class="copilot" id="copilotBox">
  🤖 Copilot
  <div id="copilotOut" style="margin-top:8px;font-size:12px;color:var(--muted)">
    Ask me anything...
  </div>

  <input id="copilotInput"
    placeholder="type here..."
    onkeydown="if(event.key==='Enter') runCopilot()"/>
</div>

<!-- TERMINAL -->
<div class="window" id="terminal" style="top:90px;left:200px;">
  <div class="header">
    <div class="controls">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="title">Vision Terminal</div>
  </div>

  <div class="content terminal" id="out"></div>

  <input id="cmd"
    placeholder="type command..."
    onkeydown="if(event.key==='Enter') run()"/>
</div>

<!-- APPS -->
<div class="window" id="apps" style="top:160px;left:260px;">
  <div class="header">
    <div class="controls">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="title">Projects</div>
  </div>

  <div class="content">
    Password Manager<br>
    File Organizer<br>
    CLI Tools<br>
    Automation Systems
  </div>
</div>

<!-- PROFILE -->
<div class="window" id="profile" style="top:240px;left:320px;">
  <div class="header">
    <div class="controls">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="title">Profile</div>
  </div>

  <div class="content">
    Eesa<br>
    Systems engineering mindset<br><br>
    Python • C++ • Architecture thinking
  </div>
</div>

<script>

/* ================= CORE ENGINE ================= */

let z=10;

function openWin(id){
  const w=document.getElementById(id);
  w.style.display="block";
  w.style.zIndex=++z;

  if(id==="terminal"){
    setTimeout(()=>document.getElementById("cmd").focus(),100);
  }
}

/* ================= DRAG ================= */

let drag=null;

document.addEventListener("mousedown",(e)=>{
  const h=e.target.closest(".header");
  if(!h) return;

  const w=h.parentElement;

  drag={
    el:w,
    ox:e.clientX-w.offsetLeft,
    oy:e.clientY-w.offsetTop
  };
});

document.addEventListener("mousemove",(e)=>{
  if(!drag) return;

  drag.el.style.left=(e.clientX-drag.ox)+"px";
  drag.el.style.top=(e.clientY-drag.oy)+"px";
});

document.addEventListener("mouseup",()=>drag=null);

/* ================= TERMINAL ================= */

function run(){
  const input=document.getElementById("cmd");
  const out=document.getElementById("out");

  const cmd=input.value.trim();
  input.value="";

  let res="";

  if(cmd==="help") res="copilot | projects | profile";
  else if(cmd.startsWith("copilot")) res="use copilot panel";
  else res="executed: "+cmd;

  out.innerText+="\n> "+cmd+"\n"+res+"\n";
  out.scrollTop=out.scrollHeight;
}

/* ================= COPILOT (REAL INPUT NOW) ================= */

function toggleCopilot(){
  const box=document.getElementById("copilotBox");
  box.style.display = box.style.display==="block"?"none":"block";
}

/* REAL INPUT BEHAVIOR */
function runCopilot(){
  const input=document.getElementById("copilotInput");
  const out=document.getElementById("copilotOut");

  const msg=input.value.toLowerCase();
  input.value="";

  if(msg.includes("learn"))
    out.innerText="Python → DSA → System Design";
  else if(msg.includes("job"))
    out.innerText="Focus: scalable systems + clean code";
  else if(msg.includes("project"))
    out.innerText="Build: automation + AI tools";
  else
    out.innerText="Try: learn / job / project";
}

/* INIT */
document.getElementById("out").innerText =
"VISION OS READY\nInteractive system loaded\n";

</script>

</body>
</html>
