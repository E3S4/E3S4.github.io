<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EESA OS</title>

<style>
:root{
  --bg:#070a12;
  --glass:rgba(255,255,255,0.06);
  --text:#eaf0ff;
  --muted:#9aa4b2;
  --accent:#7aa2ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
#boot{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:99999;
  color:#cfe0ff;
  font-family:-apple-system,system-ui;
}

.logo{
  font-size:26px;
  letter-spacing:2px;
  margin-bottom:10px;
  opacity:0;
  animation:fadeIn 1s ease forwards;
}

.sub{
  font-size:12px;
  color:#8ea3c7;
  margin-bottom:18px;
}

.loader{
  width:220px;
  height:3px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
}

.bar{
  width:40%;
  height:100%;
  background:linear-gradient(90deg,#7aa2ff,#a0b7ff);
  animation:move 1.6s infinite;
}

@keyframes move{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(250%)}
}

@keyframes fadeIn{
  from{opacity:0;transform:scale(0.95)}
  to{opacity:1;transform:scale(1)}
}
  
body{
  height:100vh;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  background:radial-gradient(circle at top,#1a2550,#05060a);
  color:var(--text);
}


body::before{
  content:"";
  position:absolute;
  inset:0;
  background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:85px 85px;
}

.dock{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:14px;
  padding:10px 16px;
  border-radius:18px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);
}

.dock div{
  font-size:12px;
  color:var(--muted);
  cursor:pointer;
  transition:0.2s;
}

.dock div:hover{
  color:white;
  transform:scale(1.08);
}


.window{
  position:absolute;
  width:520px;
  height:340px;
  background:var(--glass);
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  overflow:hidden;
  display:none;
  box-shadow:0 60px 160px rgba(0,0,0,0.7);
}

.header{
  height:38px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  background:rgba(0,0,0,0.25);
  cursor:grab;
  user-select:none;
}

.title{
  font-size:12px;
  color:var(--muted);
}

.controls{
  display:flex;
  gap:6px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.red{background:#ff5f57;}
.yellow{background:#febc2e;}
.green{background:#28c840;}

.content{
  padding:14px;
  font-size:13px;
  line-height:1.6;
}

/* TERMINAL */
.terminal{
  font-family:ui-monospace,Menlo,monospace;
  height:260px;
  overflow:auto;
  white-space:pre-wrap;
}

input{
  width:100%;
  padding:10px;
  border:none;
  outline:none;
  background:rgba(0,0,0,0.4);
  color:white;
  border-top:1px solid rgba(255,255,255,0.08);
  font-family:ui-monospace;
  font-size:13px;
}

/* COPILOT */
.copilot{
  position:absolute;
  right:20px;
  top:20px;
  width:260px;
  height:180px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(30px);
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.08);
  padding:12px;
  display:none;
}
</style>
</head>
<div id="boot">
  <div class="logo"> EESA OS</div>
  <div class="sub" id="bootText">Starting system...</div>
  <div class="loader"><div class="bar"></div></div>
</div>
<body>

<!-- COPILOT -->
<div class="copilot" id="copilotBox">
  Copilot
  <div id="copilotOut" style="margin-top:8px;font-size:12px;color:var(--muted)">
    Ask anything...
  </div>
  <input id="copilotInput" placeholder="learn / project / job"
    onkeydown="if(event.key==='Enter') runCopilot()"/>
</div>

<!-- DOCK -->
<div class="dock">
  <div onclick="openWin('terminal')">Terminal</div>
  <div onclick="openWin('apps')">Projects</div>
  <div onclick="openWin('profile')">Profile</div>
  <div onclick="toggleCopilot()">Copilot</div>
</div>

<!-- TERMINAL -->
<div class="window" id="terminal" style="top:90px;left:180px;">
  <div class="header">
    <div class="controls">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="title">EESA Terminal</div>
  </div>

  <div class="content terminal" id="out"></div>
  <input id="cmd" placeholder="ls | cd | cat | help"
    onkeydown="if(event.key==='Enter') run()"/>
</div>

<!-- APPS -->
<div class="window" id="apps" style="top:160px;left:260px;">
  <div class="header">
    <div class="controls">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="title">Projects</div>
  </div>

  <div class="content">
    Password Manager<br>
    File Organizer<br>
    Automation Tools<br>
    AI Experiments
  </div>
</div>

<!-- PROFILE -->
<div class="window" id="profile" style="top:240px;left:320px;">
  <div class="header">
    <div class="controls">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="title">Profile</div>
  </div>

  <div class="content">
    Eesa<br>
    Systems + AI builder mindset<br><br>
    Python • C++ • Architecture thinking
  </div>
</div>

<script>


let z=10;
let cwd="/";

/* WINDOW SYSTEM */
function openWin(id){
  const w=document.getElementById(id);
  w.style.display="block";
  w.style.zIndex=++z;
}

/* DRAG */
let drag=null;

document.addEventListener("mousedown",(e)=>{
  const h=e.target.closest(".header");
  if(!h) return;

  const w=h.parentElement;

  drag={
    el:w,
    ox:e.clientX-w.offsetLeft,
    oy:e.clientY-w.offsetTop
  };
});

document.addEventListener("mousemove",(e)=>{
  if(!drag) return;
  drag.el.style.left=(e.clientX-drag.ox)+"px";
  drag.el.style.top=(e.clientY-drag.oy)+"px";
});

document.addEventListener("mouseup",()=>drag=null);

const FS={
  "/":{
    type:"dir",
    children:{
      projects:{
        type:"dir",
        children:{
          "ai.txt":{type:"file",content:"AI Copilot system"},
          "os.txt":{type:"file",content:"Vision OS simulator"}
        }
      },
      notes:{
        type:"dir",
        children:{
          "idea.txt":{type:"file",content:"build macOS + AI fusion OS"}
        }
      }
    }
  }
};

function resolve(path){
  if(path==="/") return FS["/"];

  let node=FS["/"];
  const parts=path.split("/").filter(Boolean);

  for(const p of parts){
    if(!node.children[p]) return null;
    node=node.children[p];
  }
  return node;
}

/* ================= TERMINAL ================= */

function run(){
  const input=document.getElementById("cmd");
  const out=document.getElementById("out");

  const cmd=input.value.trim();
  input.value="";

  let res="";

  const [op,...args]=cmd.split(" ");

  if(op==="ls"){
    const dir=resolve(cwd);
    res=Object.keys(dir.children||{}).join("  ");
  }

  else if(op==="pwd"){
    res=cwd;
  }

  else if(op==="cd"){
    let next=args[0];
    let path=next.startsWith("/")?next:(cwd+"/"+next);

    if(resolve(path)){
      cwd=path;
      res="entered "+cwd;
    }else res="not found";
  }

  else if(op==="cat"){
    let f=resolve(cwd+"/"+args[0]);
    res=f?.content || "file not found";
  }

  else res="commands: ls cd cat pwd";

  out.innerText+="\n> "+cmd+"\n"+res+"\n";
  out.scrollTop=out.scrollHeight;
}

/* ================= COPILOT ================= */

function toggleCopilot(){
  const box=document.getElementById("copilotBox");
  box.style.display=box.style.display==="block"?"none":"block";
}

function runCopilot(){
  const i=document.getElementById("copilotInput");
  const o=document.getElementById("copilotOut");

  const m=i.value.toLowerCase();
  i.value="";

  if(m.includes("learn"))
    o.innerText="Python → DSA → System Design";
  else if(m.includes("job"))
    o.innerText="Build scalable systems + clean code";
  else if(m.includes("project"))
    o.innerText="AI tools + automation systems";
  else
    o.innerText="Try: learn / job / project";
}

/* INIT */
document.getElementById("out").innerText =
"OS READY\nfilesystem + copilot active\n";

const bootSteps = [
  "Initializing kernel...",
  "Mounting virtual filesystem...",
  "Loading UI engine...",
  "Starting Copilot service...",
  "Launching desktop environment..."
];

let i = 0;

function bootSequence(){
  const text = document.getElementById("bootText");

  const interval = setInterval(()=>{
    text.innerText = bootSteps[i];
    i++;

    if(i >= bootSteps.length){
      clearInterval(interval);

      setTimeout(()=>{
        document.getElementById("boot").style.display="none";
      },600);
    }
  },700);
}

window.onload = bootSequence;  

</script>

</body>
</html>
