<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EESA // Developer System</title>

<style>
:root{
  --bg:#05060a;
  --panel:rgba(255,255,255,0.05);
  --text:#e5e7eb;
  --muted:#9aa4b2;
  --accent:#7c86ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:ui-sans-serif,system-ui;
}

body{
  background:radial-gradient(circle at top,#0f1630,#05060a);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* GRID BACKGROUND (subtle engineering vibe) */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
}

/* MAIN WINDOW */
.window{
  width:700px;
  height:420px;
  background:var(--panel);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  margin:60px auto;
  display:flex;
  flex-direction:column;
  box-shadow:0 50px 120px rgba(0,0,0,0.6);
}

/* HEADER */
.header{
  height:40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  background:rgba(0,0,0,0.4);
  font-size:0.75rem;
  color:var(--muted);
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  display:inline-block;
  margin-right:6px;
}

.red{background:#ff5f57;}
.yellow{background:#febc2e;}
.green{background:#28c840;}

/* TERMINAL */
.terminal{
  flex:1;
  padding:14px;
  font-family:monospace;
  font-size:0.85rem;
  overflow:auto;
  white-space:pre-wrap;
  color:#c7d2fe;
}

/* INPUT */
.input{
  display:flex;
  border-top:1px solid rgba(255,255,255,0.08);
}

input{
  flex:1;
  padding:12px;
  background:transparent;
  border:none;
  color:var(--text);
  outline:none;
  font-family:monospace;
}

/* cursor feel */
input::placeholder{
  color:var(--muted);
}
</style>
</head>

<body>

<div class="window">

  <div class="header">
    <div>
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      EESA // SYSTEM TERMINAL
    </div>
    <div>v1.0</div>
  </div>

  <div class="terminal" id="terminal"></div>

  <div class="input">
    <input id="cmd" placeholder="type help..." />
  </div>

</div>

<script>

/* =========================
   STATE (FAANG STYLE)
========================= */

const state = {
  history: [],
  user: "Eesa",
};

/* =========================
   COMMAND REGISTRY (KEY UPGRADE)
========================= */

const commands = {
  help: () => `
Available commands:
- help
- about
- skills
- projects
- system
- clear
  `,

  about: () => `
Developer: Eesa
Focus: System design, automation, tools
Philosophy: build simple, scalable systems
  `,

  skills: () => `
Languages:
- Python (primary)
- C++
- Java (learning)

Core:
- DSA
- System Design thinking
- CLI tools
  `,

  projects: () => `
1. Password Manager (AES encryption)
2. File Organizer (automation engine)
3. GUI Calculator (Tkinter architecture)
  `,

  system: () => `
System Info:
- Kernel: EESA-OS
- Mode: Developer Environment
- Status: Stable
  `,

  clear: () => {
    state.history = [];
    render();
    return "";
  }
};

/* =========================
   CORE ENGINE
========================= */

const terminal = document.getElementById("terminal");
const input = document.getElementById("cmd");

function execute(cmd){
  cmd = cmd.toLowerCase().trim();

  state.history.push(`> ${cmd}`);

  if(commands[cmd]){
    const result = commands[cmd]();
    if(result) state.history.push(result);
  } else {
    state.history.push("command not found");
  }

  render();
}

/* =========================
   RENDER ENGINE
========================= */

function render(){
  terminal.innerText = state.history.join("\n");
  terminal.scrollTop = terminal.scrollHeight;
}

/* =========================
   INPUT HANDLER
========================= */

input.addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){
    execute(input.value);
    input.value = "";
  }
});

/* INIT */
state.history.push("EESA SYSTEM BOOTED");
state.history.push("type 'help' to begin");

render();

</script>

</body>
</html>
